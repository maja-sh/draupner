[package]
name = "wsx"
version = "0.6.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "ws"
path = "src/main.rs"

[[bin]]
name = "ws-dns-spike"
path = "src/bin/ws_dns_spike.rs"

[dependencies]
clap             = { version = "4", features = ["derive"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
schemars         = "0.8"
anyhow           = "1"
console          = "0.15"
glob             = "0.3"
indicatif        = "0.17"
ctrlc            = "3"
hickory-server   = "0.24"
hickory-proto    = "0.24"
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
async-trait      = "0.1"

[dev-dependencies]
tempfile         = "3"
hickory-resolver = "0.24"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

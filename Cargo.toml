[package]
name = "workspaces"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
clap             = { version = "4", features = ["derive"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
schemars         = "0.8"
anyhow           = "1"
console          = "0.15"
glob             = "0.3"
indicatif        = "0.17"
ctrlc            = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

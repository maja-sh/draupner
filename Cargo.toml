[package]
name         = "wsx"
version      = "0.7.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT"
description  = "Multi-repo git-worktree orchestration — task-scoped, de-conflicted stacks per branch."
repository   = "https://github.com/maja-sh/wsx"
readme       = "README.md"
keywords     = ["git-worktree", "workspace", "orchestration", "containers", "multi-repo"]
categories   = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
clap             = { version = "4", features = ["derive"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
schemars         = "0.8"
anyhow           = "1"
console          = "0.15"
glob             = "0.3"
indicatif        = "0.17"
ctrlc            = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

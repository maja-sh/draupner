name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds natively on macOS (no cross-compilation) and attaches the binary to a
# GitHub Release. Install with:
#   gh release download vX.Y.Z --repo hbackman/wsx -p '*aarch64-apple-darwin*' -O ws
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      # Kept as a matrix even with one entry so re-adding targets is one line
      # and a per-target break wouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
        # Deliberately omitted (add back as a matrix entry when a target lands):
        # - `x86_64-unknown-linux-gnu` — Linux is on the README roadmap but not shipping.
        # - `x86_64-apple-darwin` — no Intel Mac in this setup, and GitHub's Intel
        #   runners are scarce and being retired.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Gate the binary on its own platform's tests — a macOS-only regression
      # wouldn't show up in the ubuntu CI job. Debug profile (see ci.yml).
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # Name the asset by target so re-added targets slot in without churn.
      - name: Rename
        run: cp target/${{ matrix.target }}/release/ws ws-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ws-${{ matrix.target }}
          path: ws-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # flatten all artifacts into dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds natively on macOS (no cross-compilation), attaches the binary to a
# GitHub Release, and publishes the crate to crates.io. Install with:
#   gh release download vX.Y.Z --repo maja-sh/draupner -p '*aarch64-apple-darwin*' -O drup
# or
#   cargo install draupner
# Publishing needs CARGO_REGISTRY_TOKEN in the repo's Actions secrets.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      # Kept as a matrix even with one entry so re-adding targets is one line
      # and a per-target break wouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
        # Deliberately omitted (add back as a matrix entry when a target lands):
        # - `x86_64-unknown-linux-gnu` — Linux is on the README roadmap but not shipping.
        # - `x86_64-apple-darwin` — no Intel Mac in this setup, and GitHub's Intel
        #   runners are scarce and being retired.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Gate the binary on its own platform's tests — a macOS-only regression
      # wouldn't show up in the ubuntu CI job. Debug profile (see ci.yml).
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # Name the asset by target so re-added targets slot in without churn.
      - name: Rename
        run: cp target/${{ matrix.target }}/release/drup drup-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: drup-${{ matrix.target }}
          path: drup-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      # Full history so we can extract Release Notes trailers between tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true   # flatten all artifacts into dist/
      # Pull the `Release Notes:` block out of each commit between the previous
      # tag and this one. Skips N/A entries. See CLAUDE.md for the convention.
      - name: Compile release notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          range="${prev_tag:+$prev_tag..}${{ github.ref_name }}"
          {
            git log --format=%B "$range" | awk '
              /^Release Notes:/ { in_notes=1; next }
              in_notes && /^$/ { in_notes=0; next }
              in_notes && !/^[[:space:]]*-[[:space:]]*N\/A[[:space:]]*$/ { print }
            '
            if [ -n "$prev_tag" ]; then
              echo
              echo "---"
              echo
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${prev_tag}...${{ github.ref_name }}"
            fi
          } > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md \
              dist/*
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              dist/*
          fi

  # Publish to crates.io only after the GitHub Release is up. crates.io
  # rejects a re-publish of an existing version, so a tag that races the
  # manual `cargo publish` from a prior release will just no-op noisily.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p draupner
